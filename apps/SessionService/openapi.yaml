                type: array
                xml: { name: expected_inventory, wrapped: true }
                items: { $ref: '#/components/schemas/ExpectedLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      tags: [sessions]
      summary: Replace the expected inventory (spd_supervisor; scheduled or in_progress; `physically_added` → instruments_added)
      description: |
        Total replacement in one transaction after locking the work_session row (serializes with
        other inventory updates and with start). Lines with the same quantity keep their source;
        new or changed lines get `kit_snapshot`/`schedule_additional` by the kit rule while
        `scheduled`, and `live_add` while `in_progress`; omitted lines are deleted. Same line
        validation as create (families, quantities, tenant stock). Any other state → 409.
        Audit action `session.inventory_updated`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
