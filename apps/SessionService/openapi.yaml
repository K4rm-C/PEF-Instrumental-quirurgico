openapi: 3.0.3
info:
  title: PEF Session / Counting Service — Session API v1 (Phase A–E + Supervisor v0.2.0 + Reports v0.3.0)
  version: 1.2.0
  description: |
    **Complement v0.3.0 (stage 12, Supervisor reports):** `GET /sessions/reports/summary`, `/reports/kits`,
    `/reports/operators` and `/reports/options`. Read-only aggregates (PostgreSQL READ ONLY transactions) of the
    caller's institution, for `spd_supervisor` only (any other role: 403, audited).
    - **Filters:** `from` / `to` (ISO date or date-time; a date is a whole day in `tz`; default the last 30 days,
      at most 366), `tz`, `kit_id`, `operator_id`, `status`.
    - **Nulls:** a null metric means "no data", never 0.
    - **AI–human agreement:** compares each human validation with the YOLO suggestion it validated, not with the
      expected inventory. It is null below 5 pairs.
    - **XML responses:** `GET /api/v1/sessions/schemas/session-reports.xsd`.

    **Complement v0.2.0 (stage 8, PEF-DS09 §1.3.4):** SessionService owns the Supervisor's session
    operations of the RF portal — schedule (`POST /sessions/schedule`), full edit while scheduled
    (`PUT /sessions/{id}`), privacy agreement (`PUT /sessions/{id}/privacy-agreement`), expected
    inventory with confirmed additions (`physically_added` → `instruments_added`), the discrepancy
    queue (`GET /sessions/discrepancies`), resolution and the safe SPD close — plus the session
    snapshot reads (`expand=detail`) the RF screens are built from. The Operator's counting flow
    (start, YOLO counts, human validation, contingency report) stays in the portal: the legacy
    Operator writes here (`start`, `vision-counts`, `count-report`) answer **410 gone**
    (`details.reason = operator_flow_in_portal`) unless `SESSION_OPERATOR_WRITES_ENABLED=true`.
    Business errors carry `details.reason` (stable code, the portal shows its own message for it).
    A request refused by the role check writes `access_audit` `DENIED_<METHOD>_WORK_SESSION`
    (outcome `denied`). XML bodies are validated against
    `GET /api/v1/sessions/schemas/session-requests.xsd` (`details.reason = xsd_validation_failed`).

    **State machine** (work_session.status): `scheduled` → (Operator, portal) `in_progress` →
    (Operator report, portal) `correction_required` (open discrepancies) or `awaiting_spd_review`;
    `correction_required` → (last resolution here) `awaiting_spd_review` → (SPD close here) `closed`.
    Supervisor writes allowed per state: schedule edit / privacy only in `scheduled`; inventory in
    `scheduled` and `in_progress` (`physically_added` counts only in `in_progress`); resolve in
    `correction_required` and `awaiting_spd_review`; close only in `awaiting_spd_review` with no open
    discrepancy (and `contingency_reviewed` after a contingency count). Anything else → 409 with
    `details.status_code` and `details.reason`. Every Supervisor write locks the work_session row
    first — the same row the portal's Operator transactions lock — so the two never interleave.

    Session / Counting API v1 (contract owner: PEF-DS09 §1.3.4 v0.1.7; data model: PEF-DS04
    v0.2.2; piece lifecycle: PEF-DS03 §1.3.9.1 v0.2.1). Phase A/B: reads. Phase C: create session,
    replace expected inventory, start. Phase D: vision-counts and count-report. Phase E: resolve
    discrepancy and SPD close. Outside v1 (not implemented): abort, phase change, any
    video/camera/WebSocket endpoint.

    - **Writes:** each write is one PostgreSQL transaction: the domain rows and its
      `access_audit` row (actions `session.scheduled`, `session.inventory_updated`,
      `session.start`, `session.manual_close`, `discrepancy.resolve`, `session.spd_close`, with
      the effective correlation id) commit together or not at all. `vision-counts` writes no audit row: the `auto_count` fact is the
      record (DS09 v0.1.6 rule 5 exception; technical logs keep the correlation id). The decisive row is locked first
      (`SELECT ... FOR UPDATE`: the operation on create, the work_session on every other write,
      then the discrepancy on resolve, then instruments and reservations by id — DS03 §1.3.9.1
      order work_session → discrepancy → instrument → instrument_reservation); a state changed
      concurrently → 409.
    - **Stock:** the create/replace check (available, active pieces of the caller's institution)
      is a point-in-time validation, NOT a reservation.
    - **Start** never contacts VisionWorker; it only decides and reports `capture_mode`.

    - **Auth:** `Authorization: Bearer <access_token>` issued by Auth Service. Validated here:
      signature with exactly `JWT_ALGORITHM` (no other algorithm, never `none`), expiry,
      `type=access`, `sub`, `jti`; Redis session `auth:jwt:{jti}` present, not revoked,
      `token_type=access`, same `user_id`; user and institution active in PostgreSQL and the
      Redis institution equal to `user.institution_id`.
    - **Roles:** effective roles from `user_role` → `role` of the user's institution (never only
      the JWT `role` claim). Only `station_operator` and `spd_supervisor` have access; `it_admin`
      or any other role → 403 on every endpoint. Per action: reads need either role;
      `POST /sessions`, `PUT expected-inventory`, `resolve` and `close` need `spd_supervisor`; `start`,
      `vision-counts` and `count-report` need `station_operator` AND being the assigned
      operator (otherwise 404).
    - **Scope:** tenant = authenticated user's institution; tenant(session) =
      `operation.institution_id`. `spd_supervisor` (also when combined with `station_operator`)
      sees every session of the tenant; `station_operator` only sessions with
      `work_session.user_id` = the user. Sessions without operation are never returned.
      Out of scope, unknown or malformed UUID → 404 (indistinguishable).
    - **Formats:** `Accept: application/xml` → XML; `application/json`, `*/*` or none → JSON.
      XML element names equal JSON field names; lists are wrappers (`sessions/session`,
      `expected_inventory/line`, `counts/count`, `discrepancies/discrepancy`); `null` is
      `xsi:nil="true"`.
    - **Correlation:** `X-Correlation-ID` is echoed when it matches `^[A-Za-z0-9._:-]{1,64}$`,
      otherwise (missing, invalid or longer than 64) a UUID is generated — never truncated (DS09 v0.1.5).
      The same string is returned in the response header and error bodies, logged, and stored in
      `access_audit.correlation_id`.
servers:
  - url: http://127.0.0.1:5004
    description: Local docker compose (port is a deployment choice, not part of the contract)
tags:
  - name: sessions
  - name: supervisor
  - name: health
  - name: docs
security:
  - bearerAuth: []
paths:
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions in the caller's scope
      description: |
        Without `expand`: the DS09 v0.1.7 list, ordered by `scheduled_at` descending (nulls last), then
        `id`; query parameters do not change it. With `expand=detail`: session snapshots
        (`SessionSnapshot`, most recently updated first), optional `status` filter (comma separated
        codes) and optional pagination `page` / `per_page` (1..100; totals in `X-Total-Count`,
        `X-Page`, `X-Per-Page`, `X-Total-Pages`; the body stays a list).
      parameters:
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Session list
          headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SessionListItem' } }
            application/xml:
              schema:
                type: array
                xml: { name: sessions, wrapped: true }
                items: { $ref: '#/components/schemas/SessionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      tags: [sessions]
      summary: Schedule a session on an existing operation (spd_supervisor)
      description: |
        Creates only Session-domain rows (`work_session` scheduled + `expected_inventory`) and the
        `session.scheduled` audit row. Never creates operation, patient, physicians, privacy
        agreement or instrument reservations, and does not change `operation.status`.
        Validation (same tenant as the caller, else 422 `invalid_reference` without revealing why):
        operation exists and is `scheduled` (other status → 409); `user_id` active with an
        effective `station_operator` role of the tenant; station active, in a room of the tenant
        and, when the operation has a room, in that room; kit active of the tenant; `phase_code`
        active in `cat_operation_phase`; families active; each quantity ≤ available pieces of
        the tenant (422 `validation_error`, `details.family_id`). Line source: `kit_snapshot`
        when the family is in the kit with the same quantity, otherwise `schedule_additional`.
        No idempotency is defined: two identical submissions create two sessions.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
          application/xml:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
            example: |
              <session_request>
                <operation_id>aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa</operation_id>
                <user_id>22222222-2222-2222-2222-222222222221</user_id>
                <station_id>13131313-0000-4000-8000-000000000001</station_id>
                <kit_id>51515151-0000-4000-8000-000000000001</kit_id>
                <phase_code>start</phase_code>
                <expected_lines>
                  <line><family_id>41414141-0000-4000-8000-000000000010</family_id><expected_quantity>1</expected_quantity></line>
                </expected_lines>
              </session_request>
      responses:
        '201':
          description: Session created (Session detail)
          headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
            application/xml:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/schedule:
    post:
      tags: [supervisor]
      summary: Schedule a session (spd_supervisor) — operation + patient + surgical team + session + inventory
      description: |
        The portal's RF-SP-02 rules, one transaction: operator active with an effective
        `station_operator` role of the tenant; room of the tenant and station of that room; kit,
        patient (optional) and physicians (≥1, unique, active) of the tenant; known surgical role
        (default surgeon); existing procedure type and phase; lines 1..32767 within available stock
        (point-in-time check, no reservation). Creates operation (status scheduled), operation_patient,
        operation_physician, work_session (scheduled, capture_mode null) and expected_inventory
        (`kit_snapshot` when the line equals the kit quantity, else `schedule_additional`). With
        `privacy_notice_version_id` (active notice) it also stores the DS07 agreement. Audit
        `session.scheduled` (+ `privacy.session_agreement`). Reasons: invalid_operator,
        operator_role_required, invalid_room, invalid_station, invalid_kit, invalid_patient,
        invalid_procedure, physicians_required, physician_required, duplicate_physician,
        invalid_physician, invalid_surgical_role, invalid_phase, invalid_scheduled_at,
        lines_required, invalid_quantity, stock_block, invalid_privacy_notice.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ScheduleRequest' } }
          application/xml: { schema: { $ref: '#/components/schemas/ScheduleRequest' } }
      responses:
        '201':
          description: Scheduled session (snapshot)
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
            application/xml: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/discrepancies:
    get:
      tags: [supervisor]
      summary: Discrepancy queue of the tenant (spd_supervisor)
      description: Most recently updated first. Optional `status=open|resolved` and pagination.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Discrepancies
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SnapshotDiscrepancy' } } }
            application/xml: { schema: { type: array, xml: { name: discrepancies, wrapped: true }, items: { $ref: '#/components/schemas/SnapshotDiscrepancy' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/reports/summary:
    get:
      tags: [reports]
      summary: Sessions, discrepancies, AI-human agreement and daily activity of the period (spd_supervisor)
      parameters:
        - { name: from, in: query, schema: { type: string }, description: 'ISO date (start of that day in tz) or date-time. Default: to - 30 days.' }
        - { name: to, in: query, schema: { type: string }, description: 'ISO date (that whole day included) or date-time. Default: now.' }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA time zone of the date boundaries and activity days }
        - { name: kit_id, in: query, schema: { type: string, format: uuid }, description: A kit of the caller institution }
        - { name: operator_id, in: query, schema: { type: string, format: uuid }, description: A user of the caller institution }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCode' } }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
              example:
                filters: { from: '2026-09-01T00:00:00Z', to: '2026-10-01T00:00:00Z', tz: UTC, kit_id: null, operator_id: null, status: null }
                sessions:
                  total: 5
                  by_status: [{ code: scheduled, count: 1 }, { code: closed, count: 1 }]
                  scheduled: 1
                  in_progress: 1
                  pending_review: 2
                  closed: 1
                  reported: 3
                  timed: 3
                  avg_duration_minutes: 30.0
                  reported_with_discrepancies: 2
                  with_discrepancies_pct: 66.7
                discrepancies:
                  total: 2
                  open: 1
                  resolved: 1
                  timed: 1
                  avg_resolution_minutes: 30.0
                  by_reason: [{ code: shortage, name: Shortage versus expected inventory, total: 2, open: 1 }]
                  by_family: [{ family_id: 4f1b1a52-6e1a-4c4f-9a7e-2a1c3d4e5f60, code: NH, name: Needle holder, total: 1, open: 1 }]
                ai_agreement: { pairs: 3, agreed: 2, corrections: 1, min_pairs: 5, sufficient: false, agreement_pct: null }
                activity: [{ date: '2026-09-05', sessions: 1, reported: 1, with_discrepancies: 1 }]
            application/xml: { schema: { $ref: '#/components/schemas/ReportSummary' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/reports/kits:
    get:
      tags: [reports]
      summary: Activity per kit, most used first (paginated; spd_supervisor)
      parameters:
        - { name: from, in: query, schema: { type: string }, description: 'ISO date (start of that day in tz) or date-time. Default: to - 30 days.' }
        - { name: to, in: query, schema: { type: string }, description: 'ISO date (that whole day included) or date-time. Default: now.' }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA time zone of the date boundaries and activity days }
        - { name: kit_id, in: query, schema: { type: string, format: uuid }, description: A kit of the caller institution }
        - { name: operator_id, in: query, schema: { type: string, format: uuid }, description: A user of the caller institution }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCode' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitReport' }
            application/xml: { schema: { $ref: '#/components/schemas/KitReport' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/reports/operators:
    get:
      tags: [reports]
      summary: Activity per Operator (paginated; spd_supervisor)
      parameters:
        - { name: from, in: query, schema: { type: string }, description: 'ISO date (start of that day in tz) or date-time. Default: to - 30 days.' }
        - { name: to, in: query, schema: { type: string }, description: 'ISO date (that whole day included) or date-time. Default: now.' }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA time zone of the date boundaries and activity days }
        - { name: kit_id, in: query, schema: { type: string, format: uuid }, description: A kit of the caller institution }
        - { name: operator_id, in: query, schema: { type: string, format: uuid }, description: A user of the caller institution }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCode' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorReport' }
            application/xml: { schema: { $ref: '#/components/schemas/OperatorReport' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/reports/options:
    get:
      tags: [reports]
      summary: Filter options of the caller institution (kits, operators, status codes; spd_supervisor)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportOptions' }
            application/xml: { schema: { $ref: '#/components/schemas/ReportOptions' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/{id}:
    get:
      tags: [sessions]
      summary: Session detail (`expand=detail` → full snapshot)
      description: |
        `expand=detail` returns `SessionSnapshotDetail`: the summary plus phase, expected inventory with
        family and category names, count events (occurred_at, then open → facts → manual_close →
        session_close, then id) with the projected payload only (reason, scope, trigger,
        reported_quantity, frames_processed, video_t, pipeline, solver, model_version, verified_total,
        contingency, reference, known_final_mismatch, board.totals.family_count,
        board.families[family_id, detected_quantity], pipeline_config.solver — never boxes, scores,
        frames or run metadata), discrepancies, privacy agreement, patient, surgical team and the
        contingency count (or null).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Session detail
          headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
            application/xml:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      tags: [supervisor]
      summary: Full edit of a scheduled session (spd_supervisor)
      description: |
        Same rules as schedule (no phase, no privacy). Locks the work_session row; only while
        `scheduled` (else 409 `not_scheduled`). Replaces operator, station, kit, operation schedule /
        procedure / room, patient, surgical team and expected inventory. Audit `session.scheduled_updated`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SessionUpdateRequest' } }
          application/xml: { schema: { $ref: '#/components/schemas/SessionUpdateRequest' } }
      responses:
        '200':
          description: Updated session (snapshot)
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
            application/xml: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/{id}/privacy-agreement:
    put:
      tags: [supervisor]
      summary: Confirm the DS07 privacy agreement of a scheduled session (spd_supervisor, RF-SP-02 Via A)
      description: |
        Only while `scheduled` (409 `privacy_not_scheduled`) and before capture_mode is frozen
        (409 `capture_mode_frozen`); active notice (422 `invalid_privacy_notice`). Creates or replaces
        the agreement (purpose_quality_ops true). Audit `privacy.session_agreement`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PrivacyAgreementRequest' } }
          application/xml: { schema: { $ref: '#/components/schemas/PrivacyAgreementRequest' } }
      responses:
        '200':
          description: Session (snapshot)
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
            application/xml: { schema: { $ref: '#/components/schemas/SessionSnapshotDetail' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/sessions/{id}/expected-inventory:
    get:
      tags: [sessions]
      summary: Expected inventory lines of the session
      description: Ordered by `family_code`, `family_id`. No stock or kit data.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Lines
          headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExpectedLine' } }
            application/xml:
