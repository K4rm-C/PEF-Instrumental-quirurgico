          application/xml:
            schema: { $ref: '#/components/schemas/ExpectedInventoryUpdate' }
            example: |
              <expected_inventory_update>
                <lines>
                  <line><family_id>41414141-0000-4000-8000-000000000010</family_id><expected_quantity>2</expected_quantity></line>
                </lines>
              </expected_inventory_update>
      responses:
        '200':
          description: The expected inventory after the replacement (same as GET)
          headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
