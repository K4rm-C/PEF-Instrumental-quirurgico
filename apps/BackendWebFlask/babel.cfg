# pybabel extraction config (run from apps/BackendWebFlask, see README "Internationalization").
# Python: the app modules only (.venv, devtools and legacy stand-ins are not scanned).
[python: *.py]
[python: controllers/**.py]
[python: services/**.py]

# Jinja templates: {{ _("...") }} and ngettext(...).
[jinja2: templates/**.html]
encoding = utf-8
