# Lab LAN HTTPS front so browsers get a secure context on the Wi‑Fi IP (getUserMedia / live camera).
# Used with the integral stack — does not replace production gateway-tls.yml.
#
#   .\scripts\pef_up.ps1
#
# Open: https://<HOST_LAN_IP>:5443  (accept the lab self-signed cert once)

services:
  portal-lan:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORTAL_HTTPS_PORT:-5443}:5443"
    volumes:
      - ./infra/certs/lan/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs/lan/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./infra/certs/lan/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      web:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - pef-network
    restart: unless-stopped

  web:
    environment:
      AUTH_BROWSER_URL: ${AUTH_BROWSER_URL}
      VISION_WORKER_WS_URL: ${VISION_WORKER_WS_URL}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}

  auth:
    environment:
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-1}
