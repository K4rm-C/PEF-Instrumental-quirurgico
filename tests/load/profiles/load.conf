# Load: 50 concurrent users for 10 minutes (expected peak of a hospital shift).
locustfile = tests/load/locustfile.py
headless = true
users = 50
spawn-rate = 2
run-time = 10m
stop-timeout = 60
only-summary = true
html = tests/load/reports/load.html
csv = tests/load/reports/load
csv-full-history = true
