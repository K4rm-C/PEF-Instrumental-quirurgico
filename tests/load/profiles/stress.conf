# Stress: steps of 50 users up to 200, 3 minutes each (StressShape in locustfile.py).
# The shape is enabled with PEF_LOAD_SHAPE=stress (run_load.ps1 sets it); it drives users and run time.
locustfile = tests/load/locustfile.py
headless = true
stop-timeout = 60
only-summary = true
html = tests/load/reports/stress.html
csv = tests/load/reports/stress
csv-full-history = true
